[tools]
# Language Runtimes
node = "26.8.1"
bun = "1.4.0"
deno = "2.9.6"
go = "1.27.1"
rust = "1.98.0"
uv = "0.12.9"
shfmt = "3.14.0"
ruff = "0.16.5"
# Secret Management
fnox = "1.34.1"
age = "1.3.2"
1password = "2.39.0"
doppler = "3.76.5"
# Dev Tools
tmux = "3.7c"
herdr = "0.8.2"
gh = "2.99.0"
just = "1.58.0"
yq = "4.53.6"
fd = "10.5.0"
neovim = "0.12.5"
ripgrep = "15.2.0"
fzf = "0.74.3"
bat = "0.26.1"
eza = "0.23.5"
# Agent Harnesses
"npm:@openai/codex" = "0.154.0-alpha.1"
"github:thehumanworks/tny" = "0.3.1"

[tools."http:claude"]
version = "2.1.258"
url = 'https://downloads.claude.ai/claude-code-releases/{{ version }}/{{ os(macos="darwin") }}-{{ arch() }}/claude'
version_list_url = "https://downloads.claude.ai/claude-code-releases/latest"
checksum_url = "https://downloads.claude.ai/claude-code-releases/{{ version }}/manifest.json"
checksum_expr = '"sha256:" + fromJSON(body).platforms[(os == "macos" ? "darwin" : os) + "-" + arch].checksum'
bin = "claude"

[env]
IS_SANDBOX = "1"
EDITOR = "nvim"
_.path = ["~/.local/bin", "~/.local/share/mise/shims", "/usr/bin", "/usr/sbin"]

[bootstrap.mise_shell_activate]
bash = true

[bootstrap.user]
login_shell = "/bin/bash"

[dotfiles]
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.claude/settings.json" = { source = ".claude/settings.json", mode = "symlink" }
"~/.claude.json" = { source = ".claude.json", mode = "copy" }
"~/.codex/config.toml" = { source = ".codex/config.toml", mode = "symlink" }
"~/.config/mise/conf.d/secret-tools.toml" = { content = '''
[tools]
fnox = "1.34.1"
1password = "2.39.0"
''' }
"/root/.bashrc/fnox" = { block = '''
eval "$(mise exec -- fnox activate bash)"
eval "$(mise exec -- fnox hook-env --shell bash)"
''' }
"/root/.bash_profile/fnox" = { block = '''
eval "$(mise exec -- fnox activate bash)"
eval "$(mise exec -- fnox hook-env --shell bash)"
''' }

[settings]
minimum_release_age = "0"
experimental = true
prerelease = true
