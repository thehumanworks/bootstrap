[tools]
# Language Runtimes
python = "3.14.7"
node = "26.8.1"
bun = "1.4.0"
deno = "2.9.6"
go = "1.27.1"
rust = "1.98.0"
uv = "0.12.9"
pnpm = "12.3.1"
yarn = "4.18.0"
"npm:corepack" = "0.36.0"
shfmt = "3.14.0"
ruff = "0.16.5"
jq = "1.8.2"
shellcheck = "0.11.0"
taplo = "0.10.0"
git-lfs = "3.8.0"
# Secret Management
fnox = "1.34.1"
age = "1.3.2"
1password = "2.39.0"
doppler = "3.76.5"
# Dev Tools
tmux = "3.7c"
herdr = "0.8.2"
gh = "2.99.0"
just = "1.58.0"
yq = "4.53.6"
fd = "10.5.0"
neovim = "0.12.5"
ripgrep = "15.2.0"
fzf = "0.74.3"
bat = "0.26.1"
eza = "0.23.5"
# Agent Harnesses
"npm:@openai/codex" = "alpha"
# tny <= 0.4.0 ships *.provenance.json release assets that are SDK metadata,
# not sigstore attestations; an old mise once recorded one as provenance.slsa
# in mise.lock, tripping the provenance-downgrade guard on upgrades. If that
# recurs, delete the tny provenance block from mise.lock. tny releases after
# 0.4.0 carry real GitHub build attestations.
"github:thehumanworks/tny" = "latest"
# Ships both `tailscale` and `tailscaled` on Linux; only the CLI exists on macOS.
"aqua:tailscale/tailscale" = { version = "1.102.3", os = ["linux"] }

[tools."http:claude"]
version = "2.1.258"
url = 'https://downloads.claude.ai/claude-code-releases/{{ version }}/{{ os(macos="darwin") }}-{{ arch() }}/claude'
version_list_url = "https://downloads.claude.ai/claude-code-releases/latest"
checksum_url = "https://downloads.claude.ai/claude-code-releases/{{ version }}/manifest.json"
checksum_expr = '"sha256:" + fromJSON(body).platforms[(os == "macos" ? "darwin" : os) + "-" + arch].checksum'
bin = "claude"

[env]
IS_SANDBOX = "1"
EDITOR = "nvim"
# command-wrappers/bin comes first so `git`/`gh`/`claude`/`tny` hit the fnox
# wrappers even in shells where full `mise activate` strips the shims dir
# (e.g. Claude Code's Bash tool). Shims stay for non-activated exec paths.
_.path = ["~/.local/bin", "~/.local/share/mise/command-wrappers/bin", "~/.local/share/mise/shims", "/usr/bin", "/usr/sbin"]

# gVisor images ship /tmp as 0755; apt (and anything else that de-privileges)
# needs sticky 1777. Runs before [bootstrap.packages] so apt-get works.
[bootstrap.hooks.pre-packages]
description = "Fix /tmp permissions (gVisor images ship 0755)"
run = "chmod 1777 /tmp"

[bootstrap.mise_shell_activate]
bash = true

[bootstrap.user]
login_shell = "/bin/bash"

# Host utilities for Debian-family sandboxes. Ignored on macOS.
[bootstrap.packages]
"apt:procps" = "latest"
"apt:unzip" = "latest"
"apt:zip" = "latest"
"apt:zstd" = "latest"
"apt:file" = "latest"
"apt:tree" = "latest"
"apt:bsdextrautils" = "latest"
"apt:gettext-base" = "latest"
"apt:sqlite3" = "latest"
"apt:rsync" = "latest"
"apt:lsof" = "latest"
"apt:iproute2" = "latest"
"apt:dnsutils" = "latest"
"apt:iputils-ping" = "latest"

[dotfiles]
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
# settings.json is copied, not symlinked: Claude Code rewrites it at runtime
# (/model, /config), and a symlink would silently dirty this checkout.
"~/.claude/settings.json" = { source = ".claude/settings.json", mode = "copy" }
"~/.claude/CLAUDE.md" = { source = ".claude/CLAUDE.md", mode = "symlink" }
"~/.claude.json" = { source = ".claude.json", mode = "copy" }
# Copied for the same reason: codex writes memories/trust entries into it.
"~/.codex/config.toml" = { source = ".codex/config.toml", mode = "copy" }
"~/.config/mise/conf.d/secret-tools.toml" = { content = '''
[tools]
fnox = "1.34.1"
1password = "2.39.0"
''' }
"~/.bashrc/fnox" = { block = 'eval "$(mise exec -- fnox activate bash)"' }
"~/.bash_profile/fnox" = { block = 'eval "$(mise exec -- fnox activate bash)"' }

# PATH wrappers, not shell aliases. Modal Sandbox.exec and sb exec run argv
# directly, so [shell_alias] never fires. [wrappers] dispatch from the mise
# shim: https://mise.jdx.dev/dev-tools/shims.html#command-wrappers
# --if-missing warn keeps image-build `mise exec -- gh` working when 1Password
# is not attached. --non-interactive blocks browser prompts in sandboxes.
[wrappers.claude]
command = "fnox"
args = ["run", "--if-missing", "warn", "--non-interactive", "--", "claude"]

[wrappers.gh]
command = "fnox"
args = ["run", "--if-missing", "warn", "--non-interactive", "--", "gh"]

[wrappers.git]
command = "fnox"
args = ["run", "--if-missing", "warn", "--non-interactive", "--", "git"]

[wrappers.tny]
command = "fnox"
args = ["run", "--if-missing", "warn", "--non-interactive", "--", "tny"]

# Global (not mise.dev.toml) so the recovery path is reachable from /workdir
# and /root, not just from inside this checkout.
[tasks."ssh:start"]
description = "Join the tailnet with Tailscale SSH enabled (userspace networking)"
run = '''
set -eu
hostname="${TAILSCALE_HOSTNAME:-$(hostname)}"
up_timeout="${TAILSCALE_UP_TIMEOUT:-120s}"
state_dir=/var/lib/tailscale
socket=/var/run/tailscale/tailscaled.sock

install -d -m 0755 "$state_dir" "$(dirname "$socket")"
if ! tailscale --socket="$socket" status --json >/dev/null 2>&1; then
  # Userspace networking needs no TUN device or NET_ADMIN; survives task exit.
  setsid nohup tailscaled --tun=userspace-networking \
    --state="$state_dir/tailscaled.state" --socket="$socket" \
    >/var/log/tailscaled.log 2>&1 &
  for _ in $(seq 1 120); do
    tailscale --socket="$socket" status --json >/dev/null 2>&1 && break
    sleep 0.5
  done
  tailscale --socket="$socket" status --json >/dev/null 2>&1 || {
    echo "tailscaled did not start; see /var/log/tailscaled.log" >&2
    exit 1
  }
fi

# The auth key never appears on a command line: it is passed through a
# root-only temporary file that is removed as soon as `tailscale up` returns.
umask 077
keyfile=$(mktemp)
trap 'rm -f "$keyfile"' EXIT
printf '%s' "${TAILSCALE_AUTHKEY:-$(fnox get TAILSCALE_AUTHKEY)}" >"$keyfile"
tailscale --socket="$socket" up --ssh --auth-key="file:$keyfile" \
  --hostname="$hostname" --accept-dns=false --timeout="$up_timeout"
tailscale --socket="$socket" ip -4
'''

[tasks.test]
description = "Bootstrap contract tests"
dir = "{{ config_root }}"
run = "python -m unittest discover -s tests -v"

[settings]
minimum_release_age = "0"
# Sandboxes are 1 vCPU; don't let installs/builds thrash the core.
jobs = 2
experimental = true
