min_version = "2026.8.15"

[bootstrap.mise_shell_activate]
bash = true

[dotfiles]
"~/.config/mise/config.toml" = { source = "mise/conf.d/tools.toml", mode = "symlink" }
"~/.claude/settings.json" = { source = ".claude/settings.json", mode = "copy" }
"~/.codex/config.toml" = { source = ".codex/config.toml", mode = "copy" }

[tasks.doctor]
description = "Verify the bootstrap installation and authenticated tools"
run = '''
#!/usr/bin/env bash
set -euo pipefail

mise doctor
mise tasks validate --errors-only
mise bootstrap status --missing
FNOX_CONFIG_DIR=/nonexistent fnox --non-interactive \
  -c "$HOME/.config/fnox/config.toml" doctor

for command in git git-lfs gh fnox op codex claude jq shellcheck; do
  command -v "$command" >/dev/null || {
    printf 'missing command: %s\n' "$command" >&2
    exit 1
  }
done

for profile in github codex claude; do
  FNOX_CONFIG_DIR=/nonexistent fnox --non-interactive \
    -c "$HOME/.config/fnox/config.toml" \
    -P "$profile" --no-defaults check
done

FNOX_CONFIG_DIR=/nonexistent fnox --non-interactive \
  -c "$HOME/.config/fnox/config.toml" \
  -P github --no-defaults exec -- \
  bash -c 'gh auth status --hostname "$GH_HOST"'
'''
