redactions = ["*_TOKEN", "*_KEY"]

[env]
OP_SERVICE_ACCOUNT_TOKEN = { required = "Inject the sandbox's scoped 1Password service-account token", redact = true }

[dotfiles]
"~/.config/fnox/config.toml" = { source = "fnox.toml", mode = "copy" }
"~/.config/git/config" = { source = ".gitconfig", mode = "copy" }
