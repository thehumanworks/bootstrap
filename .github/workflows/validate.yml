name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      NO_COLOR: "1"
      OP_SERVICE_ACCOUNT_TOKEN: test-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare validation tool directory
        run: |
          mkdir -p "$RUNNER_TEMP/mise-validate"
          printf '%s\n' \
            '[tools]' \
            'fnox = "1.34.1"' \
            'shellcheck = "0.11.0"' \
            'shfmt = "3.14.0"' \
            >"$RUNNER_TEMP/mise-validate/mise.toml"
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.16
          cache: false
          working_directory: ${{ runner.temp }}/mise-validate
      - name: Validate configuration and wrapper
        run: scripts/validate.sh
      - name: Show mise formatting diff
        if: failure()
        run: |
          mise -C "$GITHUB_WORKSPACE" -E dev fmt --all
          git --no-pager diff -- '*.toml'
      - name: Smoke-test native clone plus bootstrap
        run: tests/bootstrap_from_test.sh
