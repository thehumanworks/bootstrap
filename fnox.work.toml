#:schema https://fnox.jdx.dev/schema.json
env = "exec"
if_missing = "error"

[providers.op]
type = "1password"

[profiles.op_auth.secrets]
# fnox may use this parent credential, but command profiles do not pass it on.
OP_SERVICE_ACCOUNT_TOKEN = { env = false, if_missing = "ignore" }

[profiles.github]
inherits = ["op_auth"]

[profiles.github.secrets]
GH_HOST = { default = "leadforensics.ghe.com" }
GH_TOKEN = { provider = "op", value = "op://lf/github/token" }

[profiles.codex]
inherits = ["op_auth", "github"]

[profiles.codex.secrets]
AIPROXY_API_KEY = { provider = "op", value = "op://vault/aiproxy/api/key" }

[profiles.claude]
inherits = ["op_auth", "github"]

[profiles.claude.secrets]
CLAUDE_CODE_OAUTH_TOKEN = { provider = "op", value = "op://vault/claude/oauth/token" }

[profiles.tailscale]
inherits = ["op_auth"]

[profiles.tailscale.secrets]
TAILSCALE_AUTHKEY = { provider = "op", value = "op://vault/tailscale/authkey" }
