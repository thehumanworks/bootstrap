unbind-key -n 'M-\'
unbind-key -n M--
unbind-key -n M-x
unbind-key -n M-z
unbind-key -n M-p
unbind-key -n M-t
unbind-key -n M-c
unbind-key -n M-w
unbind-key -n M-,
unbind-key -n M-.
unbind-key -n M-R
unbind-key -n M-W
unbind-key -n M-1
unbind-key -n M-2
unbind-key -n M-3
unbind-key -n M-4
unbind-key -n M-5
