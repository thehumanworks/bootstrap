##### Prefixless workspaces (Hyper = Caps Lock) ###############################

# Hyper already includes Shift, so former Alt-Shift actions use distinct letters.
bind-key -n C-M-S-s display-popup -E -d '#{E:@tw_cwd}' -w 85% -h 70% -T 'Select workspace' '"$HOME/.local/bin/tw" switch'
bind-key -n C-M-S-a display-popup -E -d '#{E:@tw_cwd}' -w 85% -h 70% -T 'Attach workspace' '"$HOME/.local/bin/tw" attach'
bind-key -n C-M-S-n display-popup -E -d '#{E:@tw_cwd}' -w 62% -h 30% -T 'Create workspace' '"$HOME/.local/bin/tw" new'
bind-key -n C-M-S-e display-popup -E -d '#{E:@tw_cwd}' -w 62% -h 30% -T 'Create agent workspace' '"$HOME/.local/bin/tw" agent'
bind-key -n C-M-S-q display-popup -E -d '#{E:@tw_cwd}' -w 85% -h 70% -T 'Remove workspace' '"$HOME/.local/bin/tw" kill'
bind-key -n C-M-S-d detach-client
bind-key -n C-M-S-r command-prompt -I '#S' -p 'Workspace name:' 'rename-session "%%"'

##### Prefixless panes ########################################################

bind-key -n C-M-S-h select-pane -L
bind-key -n C-M-S-j select-pane -D
bind-key -n C-M-S-k select-pane -U
bind-key -n C-M-S-l select-pane -R

bind-key -n C-M-S-Left resize-pane -L 5
bind-key -n C-M-S-Down resize-pane -D 5
bind-key -n C-M-S-Up resize-pane -U 5
bind-key -n C-M-S-Right resize-pane -R 5

# Split keys match the divider: - stacks panes, | puts them side by side.
# Bind the physical keys. tmux before 3.5 rejects "|" as a key name, and
# S-_ / S-| are unknown there (Ubuntu's apt tmux). Hyper already includes
# Shift, so Hyper-| arrives as C-M-S-\ and Hyper-- as C-M-S--.
bind-key -n 'C-M-S--' split-window -v -c '#{E:@tw_cwd}'
bind-key -n 'C-M-S-\' split-window -h -c '#{E:@tw_cwd}'
bind-key -n C-M-S-x kill-pane
bind-key -n C-M-S-z resize-pane -Z
bind-key -n C-M-S-p display-panes
bind-key -n C-M-S-t command-prompt -I '#{pane_title}' -p 'Pane title:' 'select-pane -T "%%"'
bind-key -n 'C-M-S-;' last-pane
# Move a chatty agent into its own window, or pull a marked pane next to this one.
bind-key -n C-M-S-b break-pane -d
bind-key -n C-M-S-m select-pane -m
bind-key -n C-M-S-v join-pane -h

##### Prefixless windows ######################################################

bind-key -n C-M-S-c new-window -c '#{E:@tw_cwd}'
bind-key -n C-M-S-Enter run-shell '"$HOME/.local/bin/tw" worktree "#{pane_id}"'
bind-key -n C-M-S-F9 confirm-before -p 'Merge worktree in #I:#W into its recorded parent branch? (y/n)' 'run-shell "\"$HOME/.local/bin/tw\" worktree-merge \"#{pane_id}\""'
bind-key -n C-M-S-F10 confirm-before -p 'Remove worktree directory and this pane (keep branch)? (y/n)' 'run-shell "\"$HOME/.local/bin/tw\" worktree-remove \"#{pane_id}\""'
bind-key -n C-M-S-w choose-tree -Zw
bind-key -n 'C-M-S-,' previous-window
bind-key -n 'C-M-S-.' next-window
bind-key -n C-M-S-i command-prompt -I '#W' -p 'Window name:' 'rename-window "%%"'
bind-key -n C-M-S-BSpace confirm-before -p 'Remove window #I:#W? (y/n)' kill-window
# Ghostty folds Hyper-Tab (Shift+Tab) into BTab; keep the plain spelling as a fallback.
bind-key -n C-M-BTab last-window
bind-key -n C-M-S-Tab last-window

bind-key -n C-M-S-1 select-window -t ':1'
bind-key -n C-M-S-2 select-window -t ':2'
bind-key -n C-M-S-3 select-window -t ':3'
bind-key -n C-M-S-4 select-window -t ':4'
bind-key -n C-M-S-5 select-window -t ':5'
bind-key -n C-M-S-6 select-window -t ':6'
bind-key -n C-M-S-7 select-window -t ':7'
bind-key -n C-M-S-8 select-window -t ':8'
bind-key -n C-M-S-9 select-window -t ':9'
bind-key -n C-M-S-0 select-window -t ':10'

##### Agent workflow helpers ##################################################

# Add a four-pane tiled agent workstream to the current workspace.
bind-key -n C-M-S-g run-shell '"$HOME/.local/bin/tw" grid 4'
# Broadcast keystrokes to every pane in the current window. The status bar shows SYNC.
bind-key -n C-M-S-y set-window-option synchronize-panes \; display-message 'broadcast input: #{?pane_synchronized,on,off}'
bind-key -n C-M-S-o display-popup -E -d '#{E:@tw_cwd}' -w 90% -h 90% -T 'Scratch shell'
# Jump to the next window whose agent rang the bell (needs input or finished).
bind-key -n C-M-S-f next-window -a
# Scroll agent output by keyboard; paste the tmux buffer.
bind-key -n 'C-M-S-[' copy-mode
bind-key -n 'C-M-S-]' paste-buffer
# Fuzzy-pick a path, URL, or token from the pane (extrakto); falls back to a regex search.
bind-key -n C-M-S-u run-shell 'if [ -x "$HOME/.config/tmux/plugins/extrakto/scripts/open.sh" ]; then "$HOME/.config/tmux/plugins/extrakto/scripts/open.sh" "#{pane_id}"; else tmux copy-mode -t "#{pane_id}"; tmux send-keys -t "#{pane_id}" -X search-backward "(https?://|~?/)[^ ]+"; fi'
bind-key -n 'C-M-S-/' display-popup -E -d '#{E:@tw_cwd}' -w 78% -h 78% -T 'tmux keys' '"$HOME/.local/bin/tw" keys --pause'

##### Nested tmux (SSH over Tailscale into a box that runs its own tmux) ####

# Every Hyper chord is a root-table bind, so the outer tmux would swallow it
# before an inner tmux in an SSH pane could see it. Hyper-Escape (or F12 from
# a terminal without Hyper) hands every key, Ctrl-a and Hyper included, to the
# pane; the same key takes them back. The status bar dims and shows NESTED
# while this tmux is passive. Session-scoped so the setting stays with the
# workspace, and unset rather than restored so global values keep applying.
bind-key -n C-M-S-Escape set-option key-table off \; set-option prefix None \; set-option prefix2 None \; set-option status-style 'fg=#88847f,bg=#2a2a2a' \; refresh-client -S
bind-key -T off C-M-S-Escape set-option -u key-table \; set-option -u prefix \; set-option -u prefix2 \; set-option -u status-style \; refresh-client -S
bind-key -n F12 set-option key-table off \; set-option prefix None \; set-option prefix2 None \; set-option status-style 'fg=#88847f,bg=#2a2a2a' \; refresh-client -S
bind-key -T off F12 set-option -u key-table \; set-option -u prefix \; set-option -u prefix2 \; set-option -u status-style \; refresh-client -S

##### Copy mode ###############################################################

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

##### Cutie Pro interface #####################################################

set-option -g status on
set-option -g status-position top
set-option -g status-interval 2
set-option -g status-justify left
set-option -g status-style 'fg=#d5d0c9,bg=#181818'
set-option -g status-left-length 70
set-option -g status-right-length 100
set-option -g status-left '#[fg=#181818,bg=#d286b7,bold] #S #[fg=#a8a29a,bg=#181818,nobold] #{@workspace_kind} #{?#{==:#{key-table},off},#[fg=#181818#,bg=#f58669#,bold] NESTED #[default],}'
# One "!" per window that rang a bell, so the attention backlog is visible at a glance.
set-option -g status-right '#[fg=#f58669,bold]#{?pane_synchronized, SYNC ,}#[fg=#f1bb79,bold]#{W:#{?window_bell_flag,!,}}#[fg=#a8a29a,bg=#181818,nobold] #{session_attached} clients · #H · %H:%M '

set-window-option -g window-status-separator ''
set-window-option -g window-status-format '#[fg=#88847f,bg=#181818] #I:#W#F '
set-window-option -g window-status-current-format '#[fg=#181818,bg=#42d9c5,bold] #I:#W#F '
set-window-option -g window-status-activity-style 'fg=#f1bb79,bg=#181818,bold'
set-window-option -g window-status-bell-style 'fg=#181818,bg=#f56e7f,bold'

set-window-option -g pane-border-lines heavy
set-window-option -g pane-border-status top
set-window-option -g pane-border-style 'fg=#363636'
set-window-option -g pane-active-border-style 'fg=#42d9c5'
# @agent_state is a per-pane option set by ~/.local/bin/agent-tmux-state (harness hooks).
set-window-option -g pane-border-format '#[fg=#88847f] #{?pane_active,●,○} #P #{pane_title} · #{pane_current_command} · #{b:#{E:@tw_cwd}}#{?#{@agent_state}, #[fg=#f1bb79 bold]#{@agent_state}#[fg=#88847f nobold],}#{?pane_dead, #[fg=#f56e7f bold][exited #{pane_dead_status}]#[fg=#88847f nobold],} '

set-option -g message-style 'fg=#181818,bg=#f1bb79,bold'
set-option -g message-command-style 'fg=#181818,bg=#80c5de,bold'
set-window-option -g mode-style 'fg=#181818,bg=#d286b7,bold'
set-window-option -g clock-mode-colour '#d286b7'

##### Plugins (tpm) ###########################################################

# scripts/install-tmux-plugins.sh clones these during `mise bootstrap`;
# prefix+I installs and prefix+U updates interactively. Loading is skipped
# when tpm is absent so a fresh machine still gets a valid configuration.
set-option -g @plugin 'tmux-plugins/tpm'
# extrakto: fuzzy-pick paths, URLs, and tokens from pane text (Hyper-u, prefix+Tab).
set-option -g @plugin 'laktak/extrakto'
set-option -g @extrakto_split_direction 'p'
set-option -g @extrakto_popup_size '80%'
set-option -g @extrakto_grab_area 'full'
set-option -g @extrakto_filter_order 'path url word all line'

# Machine-specific changes belong here and remain outside the repository.
source-file -q "$HOME/.config/tmux/local.conf"

if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'
