# tmux workspaces for persistent, multi-agent terminal sessions.
# Daily controls live in the root key table on Hyper (Caps Lock = Ctrl+Opt+Shift+Cmd).
# tmux sees that chord as C-M-S-; Ctrl-a remains the fallback prefix.

##### Terminal fidelity #######################################################

set-option -s default-terminal 'tmux-256color'
# Use a stable array slot so repeated source-file reloads stay idempotent.
set-option -s terminal-features[100] 'xterm-ghostty:RGB:clipboard:focus:hyperlinks:extkeys:sync'
set-option -s extended-keys on
# Passthrough and OSC 52 clipboard writes cross the pane-to-host trust boundary.
# See docs/tmux.md for the implications and local opt-out.
set-window-option -g allow-passthrough on
set-window-option -g alternate-screen on
set-option -s focus-events on
set-option -s set-clipboard on
set-option -g mouse on

# Keep Meta bindings responsive without making a lone Escape feel delayed.
set-option -s escape-time 20
set-option -g repeat-time 500
set-option -g display-time 1500
set-option -g display-panes-time 1500

##### Durable workspace behaviour ############################################

# Detaching, closing a terminal, or losing SSH must not remove workspaces.
set-option -g destroy-unattached off
set-option -s exit-unattached off
# When a workspace is removed, move attached clients to another one when possible.
set-option -g detach-on-destroy off

set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# 50k lines per pane keeps a dozen agent panes affordable; agents keep their own transcripts.
set-option -g history-limit 50000
set-option -g status-keys vi
set-window-option -g mode-keys vi
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{b:#{E:@tw_cwd}}:#{pane_current_command}'
set-window-option -g allow-rename off
# Streaming agent output makes activity flags pure noise; bells are rare and meaningful.
# Agent hooks ring the bell via ~/.local/bin/agent-tmux-state (Claude Code, Codex, Cursor).
set-window-option -g monitor-activity off
set-window-option -g monitor-bell on
set-option -g bell-action other
set-option -g visual-bell off
# Only display while a client is attached: with none, display-message records the
# text as a config error and the next attach dumps it into the active pane in
# view mode (the pane then eats keys until q). Bells while detached still set the
# window flag, which the status bar counts.
set-hook -g alert-bell 'if-shell -F "#{session_attached}" "display-message \"#{window_index}:#{hook_window_name} needs attention\""'

# A crashed agent keeps its last output on screen; Ctrl-a R restarts the pane.
set-window-option -g remain-on-exit failed
# Ghostty/OmniWM windows show which workspace they hold.
set-option -g set-titles on
set-option -g set-titles-string '#S · #W'
# A laptop and an SSH client on the same workspace do not shrink each other's windows.
set-window-option -g aggressive-resize on

# Merge every variable supplied by the attaching client without removing
# session-specific variables that client does not have. Explicit transient
# names still get removed when absent, avoiding stale terminal and agent state.
set-option -g update-environment '* COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS KRB5CCNAME'

# Native cwd on macOS/Linux; Bash-reported cwd on restricted PTYs (Modal).
# Before a shell's first prompt, preserve the pane's original start directory.
set-option -g @tw_cwd '#{?pane_current_path,#{pane_current_path},#{?@shell_cwd,#{@shell_cwd},#{pane_start_path}}}'

##### Prefix: escape hatch, not the primary interaction model ################

unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind-key r source-file "$HOME/.config/tmux/tmux.conf" \; display-message 'tmux configuration reloaded'
bind-key ? display-popup -E -d '#{E:@tw_cwd}' -w 78% -h 78% -T 'tmux keys' '"$HOME/.local/bin/tw" keys --pause'
bind-key c new-window -c '#{E:@tw_cwd}'
bind-key W run-shell '"$HOME/.local/bin/tw" worktree "#{pane_id}"'
bind-key F9 confirm-before -p 'Merge worktree in #I:#W into its recorded parent branch? (y/n)' 'run-shell "\"$HOME/.local/bin/tw\" worktree-merge \"#{pane_id}\""'
bind-key F10 confirm-before -p 'Remove worktree directory and this pane (keep branch)? (y/n)' 'run-shell "\"$HOME/.local/bin/tw\" worktree-remove \"#{pane_id}\""'
bind-key '"' split-window -v -c '#{E:@tw_cwd}'
bind-key '%' split-window -h -c '#{E:@tw_cwd}'
bind-key x kill-pane
# Restart a dead (remain-on-exit) pane and clear any stale agent state on it.
bind-key R respawn-pane -k \; set-option -pu @agent_state
# Toggle logging this pane's output to ~/.local/state/tmux/<session>-<window>-<pane>.log.
bind-key P pipe-pane -o 'mkdir -p "$HOME/.local/state/tmux"; cat >> "$HOME/.local/state/tmux/#{session_name}-#{window_id}-#{pane_id}.log"' \; display-message 'pane logging: #{?pane_pipe,on,off}'

